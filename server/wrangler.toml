name = "simpleremote-stats"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "simpleremote-stats"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# GET /v1/codes needs ?key=<STATS_READ_KEY>; set it with `wrangler secret put STATS_READ_KEY`.
